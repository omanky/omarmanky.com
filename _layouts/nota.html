---
layout: default
---
  <article>
    <div class="wrap row note-head">
      <h1 class="main-wide page-title">{{ page.title }}</h1>
      <p class="main-wide note-date">{% include fecha.html fecha=page.date %}</p>
    </div>

    <div class="wrap row note-wrap">
      <div class="main-wide note-body">
{{ content }}
      </div>
    </div>

    <div class="wrap row">
      <div class="main-wide">
        <div class="note-foot">
          {%- for slug in page.temas %}
          {%- assign t = site.data.temas | where: "slug", slug | first %}
          {%- if t %}
          <p><span class="mark mark--{{ t.acento }}" aria-hidden="true"></span><a href="{{ '/temas/' | append: t.slug | append: '/' | relative_url }}">{{ t.nombre }}</a></p>
          {%- endif %}
          {%- endfor %}
          <p class="back"><a href="{{ '/cuaderno/' | relative_url }}">← Cuaderno</a></p>
        </div>
      </div>
    </div>
  </article>
