- slug: trabajo-organizacion-y-conflicto
  num: "01"
  nombre: "Trabajo, organización y conflicto"
  nombre_en: "Work, organization and conflict"
  acento: rojo
  pregunta: "De dónde sacan fuerza quienes tienen pocos recursos para organizarse, y por qué sus movilizaciones no siempre dejan organizaciones que duren."
  pregunta_en: "Where those with few resources to organize find their strength, and why their mobilizations do not always leave behind organizations that last."
- slug: mineria-agroexportacion-y-territorio
